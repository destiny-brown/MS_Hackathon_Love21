<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love 21 Instagram Feed Demo</title>
    <style>
        /* 🌟 Quick & Clean Styles for the Demo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 2rem 1.5rem 2.5rem;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header h1 span {
            background: #e1306c;
            color: white;
            font-size: 0.9rem;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge i {
            font-style: normal;
            display: inline-block;
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .feed-wrapper {
            min-height: 300px;
            position: relative;
        }
        .elfsight-app-174d449a-45f4-407a-904d-43c1df129c77 {
            min-height: 400px;
        }
        .footer-note {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #eee;
            text-align: center;
            color: #777;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }
        .footer-note strong {
            color: #333;
        }
        .tag {
            background: #f0f0f0;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #555;
        }
        @media (max-width: 600px) {
            .container {
                padding: 1rem 0.8rem 1.5rem;
            }
            .header {
                flex-direction: column;
                align-items: start;
                gap: 0.8rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>
                📸 Love 21 Feed
                <span>IG</span>
            </h1>
            <div class="badge">
                <i>●</i> Auto-updates from Instagram
            </div>
        </div>

        <!-- ===== ELFSIGHT INSTAGRAM FEED ===== -->
        <div class="feed-wrapper">
            <!-- ✅ Your Elfsight widget code – no changes needed -->
            <script src="https://elfsightcdn.com/platform.js" async></script>
            <div class="elfsight-app-174d449a-45f4-407a-904d-43c1df129c77" data-elfsight-app-lazy></div>
        </div>

        <!-- ===== FOOTER NOTES ===== -->
        <div class="footer-note">
            <span><strong>✅ Auto-sync:</strong> New Instagram posts appear automatically</span>
            <span><strong>🔧 Built with:</strong> Elfsight Instagram Feed</span>
            <span class="tag">#HackathonDemo</span>
        </div>
    </div>

</body>
</html>
